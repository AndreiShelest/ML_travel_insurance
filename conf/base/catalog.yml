travel_insurance_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/travel_insurance_raw.csv

travel_insurance:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/travel_insurance.csv
  save_args:
    lineterminator: "\n"

TI_train:
  type: pandas.CSVDataset
  filepath: data/03_primary/TI_train.csv
  save_args:
    lineterminator: "\n"

TI_test:
  type: pandas.CSVDataset
  filepath: data/03_primary/TI_test.csv
  save_args:
    lineterminator: "\n"

TI_y_train:
  type: pandas.CSVDataset
  filepath: data/03_primary/TI_y_train.csv
  save_args:
    lineterminator: "\n"

TI_y_test:
  type: pandas.CSVDataset
  filepath: data/03_primary/TI_y_test.csv
  save_args:
    lineterminator: "\n"

TI_train_feature:
  type: pandas.CSVDataset
  filepath: data/04_feature/TI_train_feature.csv
  save_args:
    lineterminator: "\n"

TI_y_train_feature:
  type: pandas.CSVDataset
  filepath: data/04_feature/TI_y_train_feature.csv
  save_args:
    lineterminator: "\n"

catboost_encoder:
  type: pickle.PickleDataset
  filepath: data/04_feature/catboost_encoder.pkl
  backend: pickle

std_scaler:
  type: pickle.PickleDataset
  filepath: data/04_feature/std_scaler.pkl
  backend: pickle

TI_test_feature:
  type: pandas.CSVDataset
  filepath: data/04_feature/TI_test_feature.csv
  save_args:
    lineterminator: "\n"

TI_y_test_feature:
  type: pandas.CSVDataset
  filepath: data/04_feature/TI_y_test_feature.csv
  save_args:
    lineterminator: "\n"

logit_trained:
  type: pickle.PickleDataset
  filepath: data/06_models/logit_trained.pkl

nn_trained:
  type: pickle.PickleDataset
  filepath: data/06_models/nn_trained.pkl